services:
  - type: web
    name: mawaga-delay-risk-api
    runtime: python
    plan: free
    rootDir: services/delay-risk-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DELAY_RISK_API_KEY
        sync: false
